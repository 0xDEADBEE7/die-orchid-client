[package]
name = "die-orchid-client"
description = "A port of emacs-orchid-client to DIE: orchid's session browser and chats, as an extension outside DIE"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

# An extension, outside DIE: it depends on die-core only, never on `die`, so it stays
# platform-neutral. DIE's crates come from git at `main`, so every repository in one build has
# the same die-core; a local, gitignored `.cargo/config.toml` points them at a checkout of DIE
# (dev-config.example.toml, README.md).
[dependencies]
die-core = { git = "https://github.com/0xDEADBEE7/die", branch = "main" }
# Exact pins, as DIE's own `[workspace.dependencies]` has them.
# Local time for the stubs, from the system's zoneinfo (no bundled database).
jiff = { version = "=0.2.41", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
unicode-segmentation = "=1.13.3"
unicode-width = { version = "=0.2.2", default-features = false }

[dev-dependencies]
die-test-cap = { git = "https://github.com/0xDEADBEE7/die", branch = "main" }
die-vim = { git = "https://github.com/0xDEADBEE7/die", branch = "main" }

[lints.rust]
unsafe_code = "forbid"

# As DIE's: a panic's backtrace and no more, and optimized enough that a test of a long chat
# isn't slow.
[profile.test]
opt-level = 1
debug = "line-tables-only"
